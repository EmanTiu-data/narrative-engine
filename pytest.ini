# Pytest configuration for Narrative Engine

[tool:pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers
markers =
    # Test categories
    access_control: Access control and permission tests
    calculations: Algorithm and calculation tests
    validations: Input validation and business rule tests
    apis: External API tests
    database: Database operation tests
    edge_cases: Edge case and boundary tests
    generated_code: Generated code validation tests
    integration: Integration tests
    
    # Special markers
    slow: Tests that take a long time to run
    api: Tests that require API calls (use mocks)
    unit: Unit tests
    integration: Integration tests

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
